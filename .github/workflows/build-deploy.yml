---
name: S3/CloudFront CI/CD

on:
    push:
        branches: [main]

env:
    HUGO_VERSION: 0.151.0
    TZ: Europe/London
    GO_VERSION: '1.24'

jobs:
    build:
        runs-on: ubuntu-latest
        environment:
            name: s3-cloudfront
            url: https://ejfrick.com
        steps:
            - uses: actions/checkout@v4
              name: Checkout
              with:
                  submodules: true
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: false

            - name: Install Hugo
              run: |
                  curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_withdeploy_${HUGO_VERSION}_linux-amd64.tar.gz" && \
                    mkdir -p "${HOME}/.local/hugo" && \
                    tar -C "${HOME}/.local/hugo" -xf "hugo_extended_withdeploy_${HUGO_VERSION}_linux-amd64.tar.gz" && \
                    rm "hugo_extended_withdeploy_${HUGO_VERSION}_linux-amd64.tar.gz" && \
                    echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

            - uses: actions/cache@v5
              name: Restore Hugo Cache
              with:
                  path: ${{ runner.temp }}/hugo_cache
                  key: hugo-${{ github.run_id }}
                  restore-keys: hugo-

            - name: Build Site
              run: |
                  hugo build \
                    --minify \
                    --gc \
                    --cacheDir "${{ runner.temp }}/hugo_cache"

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-west-2

            - name: Deploy to S3 and CloudFront
              env:
                  S3_BUCKET: ${{ secrets.S3_BUCKET }}
                  CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_ID }}
              run: |
                  envsubst < hugo.toml > hugo-deploy.toml || exit 1
                  hugo deploy \
                    --target s3 \
                    --invalidateCDN \
                    --config hugo-deploy.toml
